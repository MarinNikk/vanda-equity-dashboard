# Serves the SPA and proxies /api to the backend — same-origin, so the cookie
# stays first-party and there's no CORS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA fallback
    }

    location /api/ {
        # Re-resolve `backend` per request via Docker DNS (the variable forces it),
        # not once at startup — else a backend rebuild changes its IP and nginx
        # keeps dialing the dead one, 502-ing every /api call.
        resolver 127.0.0.11 valid=10s;
        set $backend backend:8000;
        proxy_pass http://$backend;          # no URI after host = /api prefix kept
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
